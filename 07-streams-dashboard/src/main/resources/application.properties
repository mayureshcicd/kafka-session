# Each sample has its own port, so all three can run together.
spring.application.name=streams-dashboard
server.port=${SERVER_PORT:18087}

# Change this address only when your Kafka broker runs somewhere else.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Keys are strings. Each project explains its value format below.
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Let Spring commit after each successful listener call, not before the work.
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
# A new group starts from retained history. Existing groups resume their bookmark.
spring.kafka.consumer.auto-offset-reset=earliest
# Wait for all in-sync replicas. One local broker still means only one copy.
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
# Fail early with a useful error when Kafka is not running.
spring.kafka.admin.fail-fast=true
spring.kafka.admin.properties[request.timeout.ms]=10000
spring.kafka.admin.properties[default.api.timeout.ms]=15000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.producer.properties[delivery.timeout.ms]=15000

# Plain text keeps this example focused on the Kafka concept, not JSON conversion.
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Streams is a library inside this app, with its own application/group ID and local state.
spring.kafka.streams.application-id=sample-minute-dashboard
spring.kafka.streams.properties[default.key.serde]=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties[default.value.serde]=org.apache.kafka.common.serialization.Serdes$StringSerde
spring.kafka.streams.properties[statestore.cache.max.bytes]=0
spring.kafka.streams.state-dir=${DEMO_STATE_DIR:./data/streams}
