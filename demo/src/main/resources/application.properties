spring.application.name=kafka-training-demo
server.port=${SERVER_PORT:8080}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.example.kafkademo.OrderEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.example.kafkademo
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[delivery.timeout.ms]=15000
spring.kafka.producer.properties[request.timeout.ms]=10000
spring.kafka.admin.fail-fast=true
spring.kafka.admin.properties[default.api.timeout.ms]=15000
demo.replication-factor=${DEMO_REPLICATION_FACTOR:1}
spring.kafka.admin.properties[request.timeout.ms]=10000
